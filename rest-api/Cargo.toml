[package]
name = "rest-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework and HTTP utilities
axum = { version = "0.7", features = ["headers", "json"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "time"] }

# Database (Postgres) - sqlx without compile-time checked macros
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"] }

# Environment and logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# JSON Web Token
jsonwebtoken = "8.4"

# Password hashing
argon2 = "0.5"

# JSON (serde)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# For typed header extraction convenience (optional)
http = "0.2"